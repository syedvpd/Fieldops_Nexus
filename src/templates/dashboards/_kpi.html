{% load ui_tags %}<div class="col-6 col-lg-3"><div class="fx-card fx-kpi-card h-100 {% if tone == 'alert' %}fx-kpi-alert{% elif tone == 'accent' %}fx-kpi-accent{% endif %}" data-kpi="{{ key }}"><div class="fx-card-body"><div class="fx-kpi-head"><div class="fx-kpi-label">{% with link=drill|get_item:key %}{% if link %}<a class="text-reset" data-drill="{{ key }}" href="{{ link }}">{{ label }}</a>{% else %}{{ label }}{% endif %}{% endwith %}</div>{% if icon %}<span class="fx-kpi-icon">{% icon icon 16 %}</span>{% endif %}</div>
  <div class="kpi-value">{% if value is None %}<span class="text-body-secondary" title="Not enough data in this view">n/a</span>{% else %}{{ value }}{{ unit }}{% endif %}</div>
  {% if note %}<div class="fx-kpi-note">{{ note }}</div>{% endif %}</div></div></div>
