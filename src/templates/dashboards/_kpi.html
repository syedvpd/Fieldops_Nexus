<div class="col-6 col-lg-3"><div class="fx-card h-100" data-kpi="{{ key }}"><div class="fx-card-body"><div class="small text-body-secondary">{{ label }}</div>
  <div class="fs-3 fw-semibold kpi-value">{% if value is None %}<span class="text-body-secondary" title="Not enough data in this view">n/a</span>{% else %}{{ value }}{{ unit }}{% endif %}</div>
  {% if note %}<div class="small text-body-secondary">{{ note }}</div>{% endif %}</div></div></div>
