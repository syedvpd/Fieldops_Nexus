<div class="fx-card h-100"><div class="fx-card-header">{{ title }}</div><div class="fx-card-body">
{% for b in bars %}<div class="fx-bar-row"><div class="fx-bar-label" title="{{ b.label }}">{{ b.label }}</div>
  <div class="fx-bar-track" role="img" aria-label="{{ b.label }}: {{ b.value }}"><div class="fx-bar-fill" style="width:{{ b.pct }}%"></div></div>
  <div class="fx-bar-value">{{ b.value }}</div></div>
{% empty %}<p class="text-body-secondary mb-0">No data in this view.</p>{% endfor %}</div></div>
